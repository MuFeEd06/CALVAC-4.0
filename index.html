<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Security headers (meta tag layer — Vercel headers.json adds the real HTTP headers) ── -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    <!-- Content-Security-Policy: Vercel sets the production HTTP header too. -->
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self';
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com;
        img-src     'self' data: blob: https://ik.imagekit.io https://placehold.co;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://upload.imagekit.io;
        frame-src   'none';
        object-src  'none';
        base-uri    'self';
        form-action 'self';
        frame-ancestors 'none';
      " />

    <link rel="icon" href="https://ik.imagekit.io/yocxectr4/logos/clc.png?tr=w-32,h-32,f-webp" />
    <title>CALVAC — Premium Sneakers</title>

    <!-- ── Performance: preconnect to external origins ── -->
    <link rel="preconnect" href="https://ik.imagekit.io" crossorigin />
    <link rel="dns-prefetch" href="https://ik.imagekit.io" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/api/theme-css" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
